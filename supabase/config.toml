project_id = "agenda-wellness"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "agendawellness://auth-callback"
additional_redirect_urls = ["agendawellness://auth-callback", "http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"

[auth.rate_limit]
email_sent = 10
sign_in_sign_ups = 30
token_refresh = 150

[storage]
enabled = true
file_size_limit = "10MiB"

[functions.send-reminders]
verify_jwt = false   # protegida con x-cron-secret

[functions.invite-user]
verify_jwt = true

[functions.telegram-webhook]
verify_jwt = false   # protegida con X-Telegram-Bot-Api-Secret-Token

[functions.telegram-broadcast]
verify_jwt = true

[functions.backup]
verify_jwt = false   # cron (x-cron-secret) o JWT de admin validado dentro de la función
