<!DOCTYPE html>
<html lang="es">
<head>
  <!--

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Agenda Wellness · Turnos, clientes y pagos para centros de estética. Incluida en el Plan Gestión de Grupo Capybara.">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#141416">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Agenda Wellness">

  <title>Agenda Wellness · Grupo Capybara</title>
  <link rel="manifest" href="manifest.json">

<body style="background:#141416;margin:0">
  <style>
    /* La barra deja abajo ~70 px libres para el cartel "Powered by Netlify" (fijo abajo a la derecha). */
    #gc-app{position:fixed;top:0;left:0;right:0;bottom:116px}
    #gc-credito{position:fixed;left:0;right:0;bottom:0;height:116px;display:flex;align-items:flex-start;padding:12px 16px 0;
      box-sizing:border-box;border-top:1px solid rgba(255,255,255,.06);background:#171D1B;
      font:500 12px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#A1A9B1}
    #gc-credito a{color:#E0B865;text-decoration:none;font-weight:600}
    #gc-credito a:hover{text-decoration:underline}
    #gc-credito{justify-content:space-between;gap:12px}
    #gc-credito .gc-accesos{display:flex;gap:8px}
    #gc-credito .gc-acceso{border:1px solid rgba(224,184,101,.45);border-radius:999px;padding:7px 14px;white-space:nowrap}
    #gc-credito .gc-acceso:hover{text-decoration:none;background:rgba(224,184,101,.12)}
    #gc-credito .gc-c{display:none}
    @media (max-width:760px){#gc-credito .gc-l{display:none}#gc-credito .gc-c{display:inline}}
    /* Celular: los botones usan toda la fila de arriba y el crédito baja a la esquina libre de abajo a la izquierda
       (abajo a la derecha está el cartel de Netlify). */
    @media (max-width:480px){#gc-credito{padding-top:10px;font-size:11px;justify-content:center}
      #gc-credito>span:first-child{position:absolute;left:14px;bottom:12px}#gc-credito>span:first-child a{display:block}
      #gc-credito .gc-acceso{padding:6px 9px}#gc-credito .gc-accesos{gap:5px}}
  </style>
  <div id="gc-app"></div>
  <div id="gc-credito"><span>Creado por <a href="https://grupocapybara.online" target="_blank" rel="noopener">grupocapybara.online</a></span><span class="gc-accesos"><a class="gc-acceso" href="/productos-masivo.html">📦 <span class="gc-l">Carga de productos</span><span class="gc-c">Productos</span></a><a id="gc-regalo" class="gc-acceso" href="/tarjeta-regalo.html">🎁 <span class="gc-l">Tarjetas de regalo</span><span class="gc-c">Regalos</span></a><a class="gc-acceso" href="/calendario.html">📅 <span class="gc-l">Google Calendar</span><span class="gc-c">Calendario</span></a></span></div>
  <!--

    or to give the user feedback during the initialization process.

  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
