name: agenda_wellness
description: Gestión integral para centros de estética, bienestar y masoterapia.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Estado y navegación
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Backend
  supabase_flutter: ^2.8.3

  # Notificaciones push
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.69.2
  table_calendar: ^3.1.3
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Utilidades
  intl: any
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  uuid: ^4.5.1

  # Reportes
  pdf: ^3.11.1
  printing: ^5.13.4
  excel: ^4.0.6
  path_provider: ^2.1.5
  share_plus: ^10.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
