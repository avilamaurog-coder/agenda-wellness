name: Configurar base de datos Supabase

# Crea todas las tablas, permisos y funciones en el proyecto Supabase, carga los
# datos iniciales (servicios, combos, plantillas) y publica las Edge Functions.
# Ejecutar: Actions › "Configurar base de datos Supabase" › Run workflow
#
# Secretos requeridos (Settings › Secrets and variables › Actions):
#   SUPABASE_ACCESS_TOKEN  supabase.com › Account › Access Tokens › Generate new token
#   SUPABASE_PROJECT_REF   el código del proyecto: está en la URL, supabase.com/dashboard/project/<REF>
#   SUPABASE_DB_PASSWORD   la contraseña de la base que elegiste al crear el proyecto

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Cargar datos iniciales (servicios, combos, plantillas). Solo la primera vez."
        type: boolean
        default: true

jobs:
  database:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Verificar secretos
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          [ -z "$PROJECT_REF" ] && missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::error::Faltan los secretos:$missing (Settings › Secrets and variables › Actions)"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Vincular proyecto
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Crear tablas, permisos y funciones (migraciones)
        run: |
          if [ "${{ inputs.seed }}" = "true" ]; then
            supabase db push --include-seed --password "$SUPABASE_DB_PASSWORD" --yes
          else
            supabase db push --password "$SUPABASE_DB_PASSWORD" --yes
          fi

      - name: Publicar Edge Functions
        run: |
          supabase functions deploy send-reminders --no-verify-jwt --project-ref "$PROJECT_REF"
          supabase functions deploy invite-user --project-ref "$PROJECT_REF"
          supabase functions deploy telegram-webhook --no-verify-jwt --project-ref "$PROJECT_REF"
          supabase functions deploy telegram-broadcast --project-ref "$PROJECT_REF"
          supabase functions deploy backup --no-verify-jwt --project-ref "$PROJECT_REF"

      - name: Resumen
        run: |
          {
            echo "## Base de datos lista"
            echo ""
            echo "- Proyecto: \`$PROJECT_REF\`"
            echo "- URL para SUPABASE_URL: https://$PROJECT_REF.supabase.co"
            echo "- Siguiente paso: cargar SUPABASE_URL y SUPABASE_ANON_KEY y volver a compilar el APK."
          } >> "$GITHUB_STEP_SUMMARY"
