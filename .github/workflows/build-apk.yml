name: Compilar APK Android

# Compila un APK instalable directamente en el celular (sin Play Store).
# Ejecutar: GitHub › Actions › "Compilar APK Android" › Run workflow
# Resultado: se descarga desde la sección "Artifacts" de la ejecución.
#
# Secretos requeridos (Settings › Secrets and variables › Actions):
#   SUPABASE_URL        https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY   anon key pública del proyecto
# Opcional:
#   PUBLIC_CATALOG_URL  URL del catálogo web

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configuración de la app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PUBLIC_CATALOG_URL: ${{ secrets.PUBLIC_CATALOG_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan los secretos SUPABASE_URL y/o SUPABASE_ANON_KEY"
            exit 1
          fi
          cat > env/prod.json <<EOF
          {
            "APP_ENV": "prod",
            "SUPABASE_URL": "$SUPABASE_URL",
            "SUPABASE_ANON_KEY": "$SUPABASE_ANON_KEY",
            "AUTH_REDIRECT": "agendawellness://auth-callback",
            "ENABLE_PUSH": false,
            "PUBLIC_CATALOG_URL": "$PUBLIC_CATALOG_URL"
          }
          EOF

      - name: Generar y configurar proyecto Android
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.agendawellness --project-name agenda_wellness
            rm -f test/widget_test.dart
          fi
          dart run tool/configure_android.dart

      - run: flutter pub get

      - name: Análisis estático
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Compilar APK
        run: flutter build apk --release --dart-define-from-file=env/prod.json

      - name: Renombrar
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk "agenda-wellness-$VERSION.apk"
          echo "APK_NAME=agenda-wellness-$VERSION.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: agenda-wellness-apk
          path: app/${{ env.APK_NAME }}
          retention-days: 30

      - name: Publicar en Releases (solo tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/${{ env.APK_NAME }}
