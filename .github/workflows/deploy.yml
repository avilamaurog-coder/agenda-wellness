name: Deploy producción

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  backend:
    name: Supabase (migraciones + Edge Functions)
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$PROJECT_REF"
      - run: supabase db push
      - run: supabase functions deploy send-reminders --no-verify-jwt
      - run: supabase functions deploy invite-user
      - run: supabase functions deploy telegram-webhook --no-verify-jwt
      - run: supabase functions deploy telegram-broadcast
      - run: supabase functions deploy backup --no-verify-jwt

  web:
    name: Web de administración + catálogo público (Firebase Hosting)
    needs: backend
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: echo '${{ secrets.ENV_PROD_JSON }}' > env/prod.json
      - run: flutter pub get
      - run: flutter build web --release --dart-define-from-file=env/prod.json
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          entryPoint: app
          channelId: live

  android:
    name: Android App Bundle
    needs: backend
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Secretos de compilación
        run: |
          echo '${{ secrets.ENV_PROD_JSON }}'          > env/prod.json
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}'   > android/app/google-services.json
          echo '${{ secrets.ANDROID_KEYSTORE_B64 }}' | base64 -d > android/app/upload.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=upload
          storeFile=upload.jks
          EOF
      - run: flutter pub get
      - run: flutter build appbundle --release --dart-define-from-file=env/prod.json --obfuscate --split-debug-info=build/symbols
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.agendawellness.app
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: internal

  ios:
    name: iOS (TestFlight)
    needs: backend
    runs-on: macos-latest
    environment: production
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          echo '${{ secrets.ENV_PROD_JSON }}'              > env/prod.json
          echo '${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}'  > ios/Runner/GoogleService-Info.plist
      - run: flutter pub get
      - run: flutter build ipa --release --dart-define-from-file=env/prod.json --export-options-plist=ios/ExportOptions.plist
      - uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: app/build/ios/ipa/agenda_wellness.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
